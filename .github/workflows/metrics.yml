name: Metrics
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_metrics.py
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate aggregate profile metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_metrics.py
      - name: Publish metrics
        env:
          METRICS_WORKTREE: ${{ runner.temp }}/profile-metrics
        run: |
          git fetch origin metrics
          git worktree add --detach "$METRICS_WORKTREE" origin/metrics
          cp .generated/metrics.svg "$METRICS_WORKTREE/metrics.svg"
          cd "$METRICS_WORKTREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metrics.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile metrics'
            git push origin HEAD:metrics
          fi
